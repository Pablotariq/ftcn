    <script>
      const merchDoubles = document.querySelectorAll('.merch-double');
      const merchUrls = [
        'https://fetuccini.bandcamp.com/merch/f-t-c-n-ediciones-t-shirt',
        'https://fetuccini.bandcamp.com/merch/telara-a-x-radioactive-lamb-t-shirt-double-cd',
      ];

      const isDesktop = () => window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      merchDoubles.forEach((merchDouble, index) => {
        merchDouble.addEventListener('click', () => {
          if (isDesktop()) {
            window.open(merchUrls[index], '_blank', 'noopener,noreferrer');
            return;
          }
          const isFlipped = merchDouble.classList.toggle('is-flipped');
          merchDouble.setAttribute('aria-pressed', String(isFlipped));
        });

        merchDouble.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (isDesktop()) {
              window.open(merchUrls[index], '_blank', 'noopener,noreferrer');
              return;
            }
            const isFlipped = merchDouble.classList.toggle('is-flipped');
            merchDouble.setAttribute('aria-pressed', String(isFlipped));
          }
        });
      });
    </script>
