      </div>
    </section>
  
    <script>
      const blackShirt = document.querySelector('.merch-double');
      const telaranaUrl = 'https://fetuccini.bandcamp.com/merch/telara-a-x-radioactive-lamb-t-shirt-double-cd';

      const isDesktop = () => window.matchMedia('(hover: hover) and (pointer: fine)').matches;

      blackShirt.addEventListener('click', () => {
        if (isDesktop()) {
          window.open(telaranaUrl, '_blank', 'noopener,noreferrer');
          return;
        }
        const isFlipped = blackShirt.classList.toggle('is-flipped');
        blackShirt.setAttribute('aria-pressed', String(isFlipped));
      });

      blackShirt.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          if (isDesktop()) {
            window.open(telaranaUrl, '_blank', 'noopener,noreferrer');
            return;
          }
          const isFlipped = blackShirt.classList.toggle('is-flipped');
          blackShirt.setAttribute('aria-pressed', String(isFlipped));
        }
      });
    </script>
